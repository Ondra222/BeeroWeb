<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Beero</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11141B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beero">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
html,body{overflow-x:hidden}
.top{justify-content:space-between;margin-top:4px}
.logo{font-size:30px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--gold)}
#bell{flex:none;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;padding:0}
#bell svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
#loc{border:1px solid var(--line);background:none;color:var(--text);font-size:14px;padding:9px 14px;border-radius:20px;max-width:100%;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#loc.off{color:var(--gold);border-color:rgba(242,178,51,.5)}
#date{margin-top:10px}
#stage{position:relative;margin-top:26px;background:var(--cream);border-radius:28px;height:min(86vw,360px);overflow:hidden;touch-action:none}
#c{position:absolute;left:50%;top:0;transform:translateX(-50%);display:block}
#flat{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);height:calc(100% - 70px);max-width:90%;object-fit:contain;pointer-events:none;transition:transform .2s}
#flat.pop{transform:translateX(-50%) scale(1.06)}
#room{position:absolute;inset:0;pointer-events:none}
#room svg{display:block;width:100%;height:100%}
.count{position:absolute;left:0;right:0;bottom:18px;display:flex;align-items:baseline;justify-content:center;gap:10px;color:var(--navy);pointer-events:none}
#n{font-size:58px;font-weight:800;line-height:1;letter-spacing:-1px}
#nl{font-size:18px;font-weight:600}
#rs{position:absolute;top:14px;right:14px;border:none;background:rgba(31,58,99,.08);color:var(--navy);font-size:13px;font-weight:600;padding:7px 12px;border-radius:14px}
#rs[disabled]{opacity:0}
#hint{position:absolute;top:16px;left:16px;right:90px;color:var(--navy);font-size:13px;opacity:.75;pointer-events:none}
#hint:empty{display:none}
#add{display:block;width:100%;margin-top:22px;border:none;background:var(--gold);color:var(--gold-ink);font-size:21px;font-weight:700;
 padding:21px;border-radius:34px;transition:transform .12s}
#add:active{transform:scale(.97)}
#add b{font-weight:800;margin-right:8px}
.week{margin-top:16px}
/* active beer from the catalogue (what the app and the widget count) */
#kind{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;border:none;text-align:left;color:var(--text);box-shadow:inset 0 0 0 1.5px transparent}
#kind.on{box-shadow:inset 0 0 0 1.5px var(--gold)}
#kindLogo{flex:none;display:flex}
#kind .m{flex:1;min-width:0}
#kind .k{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
#kind.on .k{color:var(--gold)}
#kind .nm{display:block;font-size:17px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kind .ch{flex:none;color:var(--muted);font-size:14px;font-weight:600}
#kind .q{flex:none;width:48px;height:48px;border-radius:14px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;font-weight:700}
#evo{margin-top:16px;display:flex;flex-direction:column;gap:10px}
#evo .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#evo b{font-size:16px;font-weight:700}
#evo .r span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
#evo .eb{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
#evo .eb i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
#evo .nx{color:var(--muted);font-size:14px}
.week .row{justify-content:space-between;margin-bottom:40px}
#bars{position:relative}
.week .row b{font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="page">
 <div class="row top"><div class="logo">Beero<span>.</span></div><div class="row" style="gap:8px;min-width:0"><button id="loc" aria-label="Location">location</button><button id="bell" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div></div>
 <div class="sub" id="date">Today</div>
 <div id="stage">
  <div id="room"></div>
  <canvas id="c"></canvas>
  <button id="rs" aria-label="Undo last beer">Undo</button>
  <div id="hint"></div>
  <div class="count"><span id="n">0</span><span id="nl">beers today</span></div>
 </div>
 <button id="add"><b>+1</b>Add a beer</button>
 <button class="card" id="kind"><span id="kindLogo"></span><span class="m"><span class="k" id="kindK">Counting</span><span class="nm" id="kindN" translate="no"></span></span><span class="ch"><span>Change</span> ›</span></button>
 <div class="card" id="evo"><div class="r"><b id="evoName">Desítka</b><span id="evoTot"></span></div><div class="eb"><i id="evoBar" style="width:0"></i></div><div class="nx" id="evoNext"></div></div>
 <div class="card week"><div class="row"><b>This week</b><span class="muted" id="wk">0 beers</span></div><div class="bars" id="bars"></div></div>
</div>
<script src="android.js"></script>
<script src="ui.js"></script>
<script>
var A=window.Android||null,B=window.Beero;

 var d=new Date(),who=A&&A.getUserName?A.getUserName():'';
 document.getElementById('date').textContent=(who?(B.lang==='cs'?'Ahoj, ':'Hi, ')+who:B.tr('Today'))+' \u00b7 '+B.nice(d);
 var city=null;for(var i=list.length-1;i>=0;i--)if(list[i].city){city=list[i].city;break}

 var sunX=k==='day'?262:k==='night'?112:k==='dawn'?120:280,sunY=k==='day'?78:k==='night'?74:150,sunR=k==='night'?14:20;
 var stars='',lit='';
 if(P[4]){[[96,52],[150,64],[300,50],[236,88],[318,104],[176,44]].forEach(function(a){stars+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="1.6" fill="#fff" opacity=".85"/>'});
  [[104,170],[120,170],[220,160],[236,172],[290,166]].forEach(function(a){lit+='<rect x="'+a[0]+'" y="'+a[1]+'" width="6" height="7" fill="#F2C66B"/>'})}
 var planks='';for(var i=0;i<6;i++){var y=262+i*22+i*i*2;planks+='<path d="M0 '+y+' H400" stroke="#B98656" stroke-width="1.5" opacity=".55"/>'}
 document.getElementById('room').innerHTML='<svg viewBox="0 0 400 380" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+

  '<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EADA"/><stop offset="1" stop-color="#E9DCC5"/></linearGradient>'+
  '<linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9AE78"/><stop offset="1" stop-color="#C08A55"/></linearGradient></defs>'+

  /* window */
  '<rect x="64" y="22" width="272" height="196" rx="12" fill="#8E6240"/>'+

  '<rect x="52" y="214" width="296" height="12" rx="4" fill="#A9774E"/>'+

  '</svg>'}
room();setInterval(room,600000);
document.getElementById('bell').onclick=function(){if(A)A.go('settings')};
B.nav('today');ui.update();
/* the button and Undo also work when the 3D engine could not load */
document.getElementById('add').onclick=function(){if(window._add3d)window._add3d();else{if(A)A.addBeer();ui.update()}};
document.getElementById('rs').onclick=function(){if(window._undo3d)window._undo3d();else{if(A)A.undo();ui.update()}};
window.syncCount=function(){ui.update()};
/* fallback when the phone cannot draw 3D (no WebGL, or the GPU crashed): show a flat Beero picture instead of a blank canvas */
var flatOn=false;
/* 3D quality memory: '' = full, 'lite' = no shadows/reflections (some GPUs, e.g. Pixel 10, crash on those), 'flat' = picture only */
var G3K='beero_gl_v1';function g3(){try{return localStorage.getItem(G3K)||''}catch(e){return ''}}

var LITE=g3()==='lite';
/* 3D failed: first try the lighter 3D, only after that fall back to the picture */

function flat(){
 if(flatOn)return;flatOn=true;
 window._add3d=null;window._undo3d=null;window._evo3d=null;
 var cv=document.getElementById('c');cv.style.display='none';
 var st=document.getElementById('stage'),im=document.createElement('img');
 im.id='flat';im.src='beero.png';im.alt='Beero';st.appendChild(im);
 var h=document.getElementById('hint');if(h)h.textContent='';
 st.addEventListener('click',function(e){if(e.target.closest('button'))return;
  if(A)A.addBeer();ui.update();im.classList.add('pop');setTimeout(function(){im.classList.remove('pop')},200)})}
function hasGL(){try{var t=document.createElement('canvas');return !!(window.WebGLRenderingContext&&(t.getContext('webgl2')||t.getContext('webgl')))}catch(e){return false}}

function start(){
 if(g3()==='flat'||!hasGL()){flat();return}
 if(window.THREE){safeBoot();return}
 var s=document.createElement('script');
 s.src='https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js';
 s.onload=safeBoot;

 document.head.appendChild(s)}
function safeBoot(){try{boot()}catch(e){glFail()}}
window.addEventListener('load',start);

function boot(){
var PI=Math.PI,sin=Math.sin,cos=Math.cos;
var cv=document.getElementById('c'),cnt=document.getElementById('n'),hint=document.getElementById('hint');
var stage=document.getElementById('stage'),sr=stage.getBoundingClientRect(),h0=Math.round(sr.height-62),w0=Math.round(Math.min(sr.width,h0*1.05));
cv.style.width=w0+'px';cv.style.height=h0+'px';

[[6,6,8,4.5,0xfff0dc],[-9,3,2,3.5,0xffd9a0],[0,12,0,5,0xffffff],[-3,5,-9,3.5,0xbcd2ff]].forEach(function(p){
 var m=new THREE.Mesh(new THREE.PlaneGeometry(7,4),new THREE.MeshBasicMaterial({color:new THREE.Color(p[4]).multiplyScalar(p[3]),side:THREE.DoubleSide}));
 m.position.set(p[0],p[1],p[2]);m.lookAt(0,0,0);es.add(m)});
if(!LITE)scene.environment=pm.fromScene(es,0.05).texture;else scene.add(new THREE.HemisphereLight(0xfff3e0,0x6b5032,1.3));pm.dispose();
scene.add(new THREE.HemisphereLight(0xfff0d8,0xc8d0dc,0.3));
var key=new THREE.DirectionalLight(0xffe6c4,1.6);key.position.set(3,7,5);key.castShadow=true;

 /* text around the ring */
 var txt='BEERO \u2022 CHEERS \u2022 BEERO \u2022 CHEERS \u2022 ';x.font='700 66px sans-serif';x.fillStyle='#1F3A63';x.textAlign='center';x.textBaseline='middle';
 var total=0,ws=[];for(var k=0;k<txt.length;k++){ws.push(x.measureText(txt[k]).width);total+=ws[k]}
 var r=410,ang=-PI/2-(total/r)/2,sp=(PI*2-total/r)/txt.length;
 for(k=0;k<txt.length;k++){var a=ang+ws[k]/2/r;x.save();x.translate(C+Math.cos(a)*r,C+Math.sin(a)*r);x.rotate(a+PI/2);x.fillText(txt[k],0,0);x.restore();ang+=ws[k]/r+sp}
 var t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
var sideM=new THREE.MeshStandardMaterial({color:0xe6dac4,roughness:0.95});
var plat=new THREE.Group();
var pc=new THREE.Mesh(new THREE.CylinderGeometry(2.05,2.05,0.06,128),[sideM,new THREE.MeshStandardMaterial({map:cTex(),roughness:0.9}),sideM]);pc.position.y=-0.03;plat.add(pc);
plat.traverse(function(o){if(o.isMesh)o.receiveShadow=true});scene.add(plat);
var root=new THREE.Group();scene.add(root);
var glow=new THREE.PointLight(0xffa526,1.3,5.5,2);glow.position.set(0,1.0,0.5);root.add(glow);
var bodyG=new THREE.Group();bodyG.position.y=1.9;root.add(bodyG);
var cp=[[-0.4,0.68],[0,0.66],[0.4,0.68],[0.75,0.85],[1.0,1.2],[1.1,1.7],[1.1,2.2],[1.02,2.8],[0.95,3.2]].map(function(p){return new THREE.Vector2(p[0],p[1])});

function loop(now){if(!capturing)draw((now-t0)/1000,now);requestAnimationFrame(loop)}

/* renders 16 stills of every animation and hands them to Android for the home-screen widget.
   Pass 1 finds the area Beero uses across all animations, pass 2 saves that area only (tight crop = sharp widget). */
var FRAMES=16,LOOP=[1.2,2.4,0.8,2.4,1.4,1.496,3.2,4.0,2.6,1.208];
var OUT=384; /* longest side of a widget picture in px */
var HINT='';
function capturePoses(){
 if(!A||!A.savePose)return;
 var src=ren.domElement,cw=src.width,ch=src.height;
 var sv=variant,sa=az,sp2=pop,spl=plusT,svt=vT0,v=0;
 capturing=true;az=0.35;pop=0;plusT=0;
 /* pass 1: union bounding box of every frame (on a half-size copy, fast) */
 var hw=Math.max(1,cw>>1),hh=Math.max(1,ch>>1),hc=document.createElement('canvas');hc.width=hw;hc.height=hh;
 var hx=hc.getContext('2d',{willReadFrequently:true});
 var x0=hw,y0=hh,x1=-1,y1=-1;
 function scan(){
  var d=hx.getImageData(0,0,hw,hh).data;
  for(var y=0;y<hh;y++){var row=y*hw*4;for(var x=0;x<hw;x++){if(d[row+x*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}}}
 function measure(){
  if(v>=10){v=0;setTimeout(save,30);return}
  hint.textContent='Preparing the widget pictures\u2026 '+(v+1)+'/20';
  applyVariant(v);vT0=0;
  for(var f=0;f<FRAMES;f++){draw(f/FRAMES*LOOP[v],7000);hx.clearRect(0,0,hw,hh);hx.drawImage(src,0,0,hw,hh);scan()}
  v++;setTimeout(measure,30)}
 /* pass 2: crop to that box (+ small margin) and save */
 var sx,sy,sw,sh,tmp,tc;
 function save(){
  if(x1<0){x0=0;y0=0;x1=hw-1;y1=hh-1}
  var m=6;sx=Math.max(0,x0*2-m);sy=Math.max(0,y0*2-m);
  sw=Math.min(cw,x1*2+2+m)-sx;sh=Math.min(ch,y1*2+2+m)-sy;
  var k=OUT/Math.max(sw,sh);if(k>1)k=1; /* never upscale */
  tmp=document.createElement('canvas');tmp.width=Math.round(sw*k);tmp.height=Math.round(sh*k);
  tc=tmp.getContext('2d');tc.imageSmoothingEnabled=true;tc.imageSmoothingQuality='high';
  step()}
 function step(){
  if(v>=10){az=sa;pop=sp2;plusT=spl;applyVariant(sv);vT0=svt;capturing=false;hint.innerHTML=HINT;return}
  hint.textContent='Preparing the widget pictures\u2026 '+(v+11)+'/20';
  applyVariant(v);vT0=0;
  for(var f=0;f<FRAMES;f++){
   draw(f/FRAMES*LOOP[v],7000);
   tc.clearRect(0,0,tmp.width,tmp.height);tc.drawImage(src,sx,sy,sw,sh,0,0,tmp.width,tmp.height);
   A.savePose(v*FRAMES+f,tmp.toDataURL('image/png'))}
  v++;setTimeout(step,30)}
 measure()}

function add(){beers=A?A.addBeer():beers+1;cnt.textContent=beers;setVariant();pop=0.35;plusT=0.9;
 if(navigator.vibrate)try{navigator.vibrate(18)}catch(e){}
 ui.update();setTimeout(ui.update,400);setTimeout(ui.update,8000)}
stage.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;drag=1;moved=0;lastX=e.clientX;downT=performance.now()});
stage.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-lastX;lastX=e.clientX;moved+=Math.abs(dx);az-=dx*0.012});
stage.addEventListener('pointerup',function(){if(!drag)return;drag=0;if(flatOn)return;if(moved<8&&performance.now()-downT<500)add()});
stage.addEventListener('pointercancel',function(){drag=0});
window._add3d=add;
window._evo3d=function(n){var k=evoOf(n);if(k===estg)return;var up=estg>=0&&k>estg;setStage(k);
 if(up){pop=0.35;hint.textContent=(B.lang==='cs'?'Nový stupeň: ':'New stage: ')+EVO_N[k];setTimeout(function(){hint.innerHTML=HINT},4000)}};
window._evo3d(B.stats(B.load()).total);
window._undo3d=function(){beers=A?A.undo():Math.max(0,beers-1);cnt.textContent=beers;setVariant();ui.update()};
window.syncCount=function(){ui.update();if(!A)return;loadMoods();var n=A.getCount();beers=n;cnt.textContent=n;setVariant()};

if(A){beers=A.getCount();cnt.textContent=beers}
setVariant();requestAnimationFrame(loop);
/* the widget is now a tally sheet, so the 3D widget pictures are no longer generated (capturePoses kept for later use) */
}
