<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Beero</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11141B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beero">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
html,body{overflow-x:hidden}
.top{justify-content:space-between;margin-top:4px}
.logo{font-size:30px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--gold)}
#bell{flex:none;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;padding:0}
#bell svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
#loc{border:1px solid var(--line);background:none;color:var(--text);font-size:14px;padding:9px 14px;border-radius:20px;max-width:100%;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#loc.off{color:var(--gold);border-color:rgba(242,178,51,.5)}
#date{margin-top:10px}
#stage{position:relative;margin-top:26px;background:var(--cream);border-radius:28px;height:min(86vw,360px);overflow:hidden;touch-action:none}
#c{position:absolute;left:50%;top:0;transform:translateX(-50%);display:block}
#flat{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);height:calc(100% - 70px);max-width:90%;object-fit:contain;pointer-events:none;transition:transform .2s}
#flat.pop{transform:translateX(-50%) scale(1.06)}
#room{position:absolute;inset:0;pointer-events:none}
#room svg{display:block;width:100%;height:100%}
.count{position:absolute;left:0;right:0;bottom:18px;display:flex;align-items:baseline;justify-content:center;gap:10px;color:var(--navy);pointer-events:none}
#n{font-size:58px;font-weight:800;line-height:1;letter-spacing:-1px}
#nl{font-size:18px;font-weight:600}
#rs{position:absolute;top:14px;right:14px;border:none;background:rgba(31,58,99,.08);color:var(--navy);font-size:13px;font-weight:600;padding:7px 12px;border-radius:14px}
#rs[disabled]{opacity:0}
#hint{position:absolute;top:16px;left:16px;right:90px;color:var(--navy);font-size:13px;opacity:.75;pointer-events:none}
#hint:empty{display:none}
#add{display:block;width:100%;margin-top:22px;border:none;background:var(--gold);color:var(--gold-ink);font-size:21px;font-weight:700;
 padding:21px;border-radius:34px;transition:transform .12s}
#add:active{transform:scale(.97)}
#add b{font-weight:800;margin-right:8px}
.week{margin-top:16px}
/* active beer from the catalogue (what the app and the widget count) */
#kind{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;border:none;text-align:left;color:var(--text);box-shadow:inset 0 0 0 1.5px transparent}
#kind.on{box-shadow:inset 0 0 0 1.5px var(--gold)}
#kindLogo{flex:none;display:flex}
#kind .m{flex:1;min-width:0}
#kind .k{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
#kind.on .k{color:var(--gold)}
#kind .nm{display:block;font-size:17px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kind .ch{flex:none;color:var(--muted);font-size:14px;font-weight:600}
#kind .q{flex:none;width:48px;height:48px;border-radius:14px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;font-weight:700}
#evo{margin-top:16px;display:flex;flex-direction:column;gap:10px}
#evo .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#evo b{font-size:16px;font-weight:700}
#evo .r span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
#evo .eb{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
#evo .eb i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
#evo .nx{color:var(--muted);font-size:14px}
.week .row{justify-content:space-between;margin-bottom:40px}
#bars{position:relative}
.week .row b{font-size:16px;font-weight:700}
/* add earlier beers */
.sub2{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.sub2 button{border:1px solid var(--line);background:none;color:var(--text);font-size:15px;font-weight:600;padding:10px 18px;border-radius:20px}
/* day history */
.hNav{display:flex;align-items:center;gap:8px;margin-top:10px}
.hNav>button{width:44px;height:44px;flex:none;border:none;border-radius:14px;background:var(--card);font-size:22px;font-weight:600;color:var(--text)}
.hNav>button:disabled{opacity:.25}
.hDay{flex:1;min-width:0;position:relative;text-align:center;background:var(--card);border-radius:14px;padding:6px 8px}
.hDay b{display:block;font-size:17px}
.hDay span{color:var(--muted);font-size:13px}
.hDay input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none}
#hList{margin-top:14px}
.hr{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.hr:last-child{border-bottom:none}
.hr .tm{font-weight:700;font-variant-numeric:tabular-nums;width:46px;flex:none}
.hr .m{flex:1;min-width:0}
.hr .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .m .w{color:var(--muted);font-size:13px;margin-top:2px}
.hr .na{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;color:#5BB98C;border:1px solid #5BB98C;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.hr .del{flex:none;width:40px;height:40px;border:none;border-radius:12px;background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center}
.hr .del svg{width:19px;height:19px}
.hEmpty{color:var(--muted);text-align:center;padding:28px 0}
#hAll{display:block;width:100%;margin-top:16px;border:1px solid #E5654B;background:none;color:#E5654B;font-size:16px;font-weight:700;padding:14px;border-radius:22px}
#hAll.sure{background:#E5654B;color:#fff}
#hAll[hidden]{display:none}
.hr .m{background:none;border:none;text-align:left;color:inherit;font:inherit;padding:0;cursor:pointer}
.hr .w .pin{color:var(--gold);font-weight:600}
/* place of the latest beer, right under +1 */
#where{display:flex;align-items:center;gap:8px;max-width:100%;margin:12px auto 0;border:none;background:none;color:var(--muted);font-size:14px;padding:4px 8px}
#where[hidden]{display:none}
#where svg{width:16px;height:16px;flex:none}
#where span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#where b{color:var(--gold);font-weight:700;flex:none}
/* place editor */
#vBg{z-index:2550}
#vName{margin-top:4px}
#vSug .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vSug .pill small{color:var(--muted);font-weight:500;margin-left:6px}
#vSug .pill.on small{color:inherit}
.vAll{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px}
.vAll[hidden]{display:none}
.vAll input{width:22px;height:22px;accent-color:var(--gold);flex:none}
#vNote{color:var(--muted);font-size:13px;margin:10px 2px 0;min-height:16px}
#vSave{display:block;width:100%;margin-top:14px;border:none;background:var(--gold);color:var(--gold-ink);font-size:18px;font-weight:700;padding:16px;border-radius:24px}
#vSave:disabled{opacity:.4}
#vDel{display:block;width:100%;margin-top:10px;border:none;background:none;color:#E5654B;font-size:15px;font-weight:700;padding:10px}
#vDel[hidden]{display:none}
.shBg{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.shBg[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheet .hd b{font-size:21px;font-weight:700}
.sheet .x{border:none;background:var(--card);width:36px;height:36px;border-radius:18px;font-size:20px;line-height:1}
.sheet .lb{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.sheet .pills{flex-wrap:wrap}
.sheet .pill{padding:9px 14px;font-size:14px}
.fld{display:block;width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none;color-scheme:inherit}
.fld[hidden]{display:none}
.duo{display:flex;gap:12px}
.duo>div{flex:1;min-width:0}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:4px}
.stp button{width:40px;height:40px;border:none;border-radius:11px;background:none;font-size:22px;font-weight:600}
.stp button:disabled{opacity:.25}
.stp span{font-weight:700;font-size:18px}
#pSum{color:var(--muted);font-size:14px;margin:14px 2px 0;min-height:18px}
#pErr{color:#E5654B;font-size:14px;margin:6px 2px 0;min-height:18px}
#pSave{display:block;width:100%;margin-top:12px;border:none;background:var(--gold);color:var(--gold-ink);font-size:18px;font-weight:700;padding:16px;border-radius:24px}
#pSave:disabled{opacity:.4}
.snack{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + 14px);z-index:2700;background:var(--text);color:var(--gold-ink);border-radius:16px;
 padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(160%);transition:transform .3s}
.snack.show{transform:none}
.snack span{flex:1}
.snack button{border:none;background:none;color:inherit;font-weight:800;font-size:15px;padding:6px 8px;text-decoration:underline}
/* blood alcohol estimate */
#bac{margin-top:16px;display:block;width:100%;border:none;text-align:left;color:var(--text)}
#bac .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#bac .k{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
#bac .v{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
#bac .v small{font-size:20px;font-weight:700;margin-left:4px}
#bac .s{color:var(--muted);font-size:14px;margin-top:2px}
#bac .s b{color:var(--text);font-weight:700}
#bac svg{display:block;width:100%;height:70px;margin-top:10px;overflow:visible}
#bac .f{color:var(--faint);font-size:12px;margin-top:10px}
#bac .go{color:var(--gold);font-weight:700;font-size:15px;margin-top:8px}
#bac.hi .v{color:#E5654B}
#bac.mid .v{color:var(--gold)}
</style>
</head>
<body>
<div class="page">
 <div class="row top"><div class="logo">Beero<span>.</span></div><div class="row" style="gap:8px;min-width:0"><button id="loc" aria-label="Location">location</button><button id="bell" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div></div>
 <div class="sub" id="date">Today</div>
 <div id="stage">
  <div id="room"></div>
  <canvas id="c"></canvas>
  <button id="rs" aria-label="Undo last beer">Undo</button>
  <div id="hint"></div>
  <div class="count"><span id="n">0</span><span id="nl">beers today</span></div>
 </div>
 <button id="add"><b>+1</b>Add a beer</button>
 <button id="where" hidden></button>
 <div class="sub2"><button id="past">+ Add earlier beers</button><button id="hist">History</button></div>
 <button class="card" id="bac"></button>
 <button class="card" id="kind"><span id="kindLogo"></span><span class="m"><span class="k" id="kindK">Counting</span><span class="nm" id="kindN" translate="no"></span></span><span class="ch"><span>Change</span> ›</span></button>
 <div class="card" id="evo"><div class="r"><b id="evoName">Desítka</b><span id="evoTot"></span></div><div class="eb"><i id="evoBar" style="width:0"></i></div><div class="nx" id="evoNext"></div></div>
 <div class="card week"><div class="row"><b>This week</b><span class="muted" id="wk">0 beers</span></div><div class="bars" id="bars"></div></div>
</div>
<div class="shBg" id="pBg" hidden><div class="sheet" role="dialog" aria-label="Add earlier beers">
 <div class="hd"><b>Add earlier beers</b><button class="x" id="pX" aria-label="Close">&times;</button></div>
 <span class="lb">Day</span>
 <div class="pills" id="pDay"></div>
 <input class="fld" type="date" id="pDate" hidden style="margin-top:10px">
 <div class="duo">
  <div><span class="lb">Time of the first</span><input class="fld" type="time" id="pTime"></div>
  <div><span class="lb">How many</span><div class="stp"><button id="pMinus" aria-label="Fewer">&minus;</button><span id="pN">1</span><button id="pPlus" aria-label="More">+</button></div></div>
 </div>
 <div id="pGapBox"><span class="lb">One every</span><div class="pills" id="pGap"></div></div>
 <span class="lb">Beer</span>
 <select class="fld" id="pBeer" translate="no"></select>
 <span class="lb">Size</span>
 <div class="pills" id="pVol"></div>
 <div id="pSum"></div>
 <div id="pErr"></div>
 <button id="pSave">Add</button>
</div></div>
<div class="shBg" id="hBg" hidden><div class="sheet" role="dialog" aria-label="History">
 <div class="hd"><b>History</b><button class="x" id="hX" aria-label="Close">&times;</button></div>
 <div class="hNav">
  <button id="hPrev" aria-label="Previous day">&lsaquo;</button>
  <label class="hDay"><b id="hTitle"></b><span id="hSum"></span><input type="date" id="hPick" aria-label="Pick a day"></label>
  <button id="hNext" aria-label="Next day">&rsaquo;</button>
 </div>
 <div id="hList"></div>
 <button id="hAll" hidden></button>
</div></div>
<div class="shBg" id="vBg" hidden><div class="sheet" role="dialog" aria-label="Place">
 <div class="hd"><b>Place</b><button class="x" id="vX" aria-label="Close">&times;</button></div>
 <div id="vBeer" class="muted" style="font-size:14px;margin-bottom:4px"></div>
 <span class="lb">Name of the pub or place</span>
 <input class="fld" id="vName" maxlength="60" autocomplete="off" enterkeyhint="done" placeholder="e.g. At Pepa's garden">
 <div id="vSugBox"><span class="lb">Places you have been</span><div class="pills" id="vSug"></div></div>
 <label class="vAll" id="vAllBox"><input type="checkbox" id="vAll" checked><span id="vAllT"></span></label>
 <div id="vNote"></div>
 <button id="vSave">Save</button>
 <button id="vDel" hidden>Remove the place</button>
</div></div>
<script src="android.js"></script>
<script src="ui.js"></script>
<script>
var A=window.Android||null,B=window.Beero;
var ui={update:function(){
 var list=B.load(),st=B.stats(list),n=st.today;
 document.getElementById('n').textContent=n;
 document.getElementById('nl').textContent=B.lang==='cs'?B.word(n,'beer')+' dnes':(n===1?'beer today':'beers today');
 document.getElementById('rs').disabled=n===0;
 var d=new Date(),who=A&&A.getUserName?A.getUserName():'';
 document.getElementById('date').textContent=(who?(B.lang==='cs'?'Ahoj, ':'Hi, ')+who:B.tr('Today'))+' \u00b7 '+B.nice(d);
 var city=null;for(var i=list.length-1;i>=0;i--)if(list[i].city){city=list[i].city;break}
 var on=A?A.hasLocationPermission():true,loc=document.getElementById('loc');
 loc.textContent=(city?city+' \u00b7 ':'')+B.tr(on?'location on':'location off');loc.className=on?'':'off';
 var wk=B.week(st.days),max=1,sum=0;wk.forEach(function(w){max=Math.max(max,w.n);sum+=w.n});
 document.getElementById('wk').textContent=B.n(sum,'beer');
 document.getElementById('bars').innerHTML=wk.map(function(w){
  return '<div class="b'+(w.today?' on':'')+'"><i style="height:'+Math.max(12,Math.round(w.n/max*100))+'%"></i><span>'+w.label+'</span></div>'}).join('');
 B.bindBars(document.getElementById('bars'),wk.map(function(w){var d=B.parse(w.d);
  return '<b>'+w.n+'</b> '+B.word(w.n,'beer')+' \u00b7 '+(w.today?B.tr('today'):B.nice(d))}));
 evoUi(list.filter(function(b){return !b.na}).length);
 kindUi();
 bacUi(list);
 if(window.whereUi)whereUi(list);
 var res=B.awards(list),fresh=B.newAwards(res);
 fresh.forEach(function(r,i){setTimeout(function(){B.toast(r)},i*4000)});
 if(fresh.length)B.markSeen(res)}};
/* evolution: Beero grows with the TOTAL number of beers ever (never resets) */
var EVO_N=['Malé pivo','Desítka','Dvanáctka','Štamgast','Sládek','Hospodský povaleč'],EVO_TH=[0,25,100,250,500,1000];
function evoStage(n){var k=0;for(var i=0;i<EVO_TH.length;i++)if(n>=EVO_TH[i])k=i;return k}
function evoUi(n){var k=evoStage(n),cs=B.lang==='cs',nx=EVO_TH[k+1];
 document.getElementById('evoName').textContent=(cs?'Stupeň ':'Stage ')+(k+1)+'/6 \u00b7 '+EVO_N[k];
 document.getElementById('evoTot').textContent=cs?(n+' celkem'):(n+' total');
 document.getElementById('evoBar').style.width=(nx?Math.round((n-EVO_TH[k])/(nx-EVO_TH[k])*100):100)+'%';
 document.getElementById('evoNext').textContent=nx?(cs?'Ještě '+B.n(nx-n,'beer')+' do stupně '+EVO_N[k+1]:B.n(nx-n,'beer')+' to '+EVO_N[k+1]):(cs?'Nejvyšší stupeň dosažen':'Top stage reached');
 if(window._evo3d)window._evo3d(n)}
/* the beer picked in the catalogue: every new beer (button or widget) gets this kind */
function kindUi(){var k=null;try{k=A&&A.getActiveBeer?JSON.parse(A.getActiveBeer()||'null'):(window.DEMO_ACTIVE||null)}catch(e){k=null}
 var el=document.getElementById('kind');el.className='card'+(k?' on':'');
 document.getElementById('kindLogo').innerHTML=k?B.logo(k.brand,k.logo,48):'<span class="q" aria-hidden="true">?</span>';
 document.getElementById('kindK').textContent=B.tr(k?'Counting':'Choose your beer');
 document.getElementById('kindN').textContent=k?k.label:B.tr('Beers are counted without a kind.')}
document.getElementById('kind').onclick=function(){if(A)A.go('catalog')};
/* ---------- blood alcohol estimate (B.bac in ui.js), refreshed every minute ---------- */
function bacUi(list){
 var el=document.getElementById('bac'),cs=B.lang==='cs',body=null;
 try{body=A&&A.getBody?JSON.parse(A.getBody()):(window.DEMO_BODY||null)}catch(e){body=null}
 var r=B.bac(list||B.load(),body,Date.now());
 if(!r){el.className='card';
  el.innerHTML='<div class="k">'+(cs?'Odhad promile':'Blood alcohol estimate')+'</div>'+
   '<div class="s" style="margin-top:6px">'+(cs?'Doplň pohlaví, výšku a váhu a Beero ti spočítá orientační promile podle druhu piva a času.':'Add your sex, height and weight and Beero estimates your blood alcohol from the beer type and the time.')+'</div>'+
   '<div class="go">'+(cs?'Doplnit v nastavení ›':'Fill in in Settings ›')+'</div>';
  return}
 var v=r.now,lvl=v>=0.5?'hi':v>=0.2?'mid':'';
 el.className='card'+(lvl?' '+lvl:'');
 var sub;
 if(v>0&&r.soberTs)sub=(cs?'Na nule zhruba v ':'Back to zero around ')+'<b>'+B.hhmm(r.soberTs)+'</b>'+dayHint(r.soberTs);
 else if(r.soberTs)sub=(cs?'Alkohol se ještě vstřebává, na nule zhruba v ':'Still being absorbed, back to zero around ')+'<b>'+B.hhmm(r.soberTs)+'</b>'+dayHint(r.soberTs);
 else sub=cs?'Za posledních 24 hodin žádný alkohol v krvi':'No alcohol in your blood from the last 24 hours';

/* renders 16 stills of every animation and hands them to Android for the home-screen widget.

var FRAMES=16,LOOP=[1.2,2.4,0.8,2.4,1.4,1.496,3.2,4.0,2.6,1.208];

  var d=hx.getImageData(0,0,hw,hh).data;
  for(var y=0;y<hh;y++){var row=y*hw*4;for(var x=0;x<hw;x++){if(d[row+x*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}}}

  if(v>=10){v=0;setTimeout(save,30);return}

 var sx,sy,sw,sh,tmp,tc;

  if(x1<0){x0=0;y0=0;x1=hw-1;y1=hh-1}
  var m=6;sx=Math.max(0,x0*2-m);sy=Math.max(0,y0*2-m);
